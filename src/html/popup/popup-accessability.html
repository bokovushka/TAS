<div class="modal modal--custom modal--custom-2 popup-accessability fade" id="popup-accessability" data-keyboard="false" tabindex="-1" aria-labelledby="popup-accessabilityLabel" aria-hidden="true">

		<div class="modal-content">
			<div class="modal-body p-8">
				<div class="d-flex align-items-start justify-content-between mb-5">
					<div class="modal-title h4 font-m mb-0 pr-4">Налаштування доступності</div>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">
							<svg>
								<use xlink:href="img/icons/icons.svg#i-close"></use>
							</svg>
						</span>
					</button>
				</div>
				<div class="row">
					<div class="col-12">
						<div class="settings-visual">
							<div class="settings-visual--item">
								<div class="settings-name">Розмір шрифта:</div>
								<div class="settings-options">
									<button type="button" class="active btn px-5 py-2 settings-option">Аа</button>

									<button type="button" class="btn px-5 py-2 settings-option">Аа</button>

							</div>
							<div class="color-scheme settings-visual--item">

									<button type="button" class="active btn px-5 py-2 settings-option">
										<span>Звичайна</span><span class="settings-option--icon"></span></button>
									<button type="button" class="scheme-white-black btn px-5 py-2 settings-option color-scheme--change">

									<button type="button" class="scheme-black-white btn px-5 py-2 settings-option color-scheme--change">

									<button type="button" class="scheme-blue btn px-5 py-2 settings-option color-scheme--change">

							</div>
							<div class="settings-visual--item">

									<button type="button" class="active btn px-5 py-2 settings-option">Звичайні</button>
									<button type="button" class="btn px-5 py-2 settings-option">Чорно-білі</button>
									<button type="button" class="btn px-5 py-2 settings-option">Приховати</button>

							</div>
